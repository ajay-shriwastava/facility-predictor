[project]
name = "facility-predictor"
version = "0.1.0"
description = "Facility Usage Prediction System for residential communities"
authors = [
    {name = "Ajay Shriwastava", email = "ashriwastava@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "faker>=20.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "mlflow>=2.9",
    "streamlit>=1.29",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[tool.poetry]
packages = [{include = "facility_predictor", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
ruff = ">=0.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "DTZ001",  # naive datetimes are intentional in synthetic data generator
    "C408",    # dict() vs {} literal is a style preference
]
